      - name: resultsHeading
        label: Заголовок блока «Результаты»
        type: string
      - name: totalWeeks
        label: Сколько всего недель в курсе
        type: number
      - name: weeks
        label: Программа курса (недели)
        type: object
        list: true
        fields:
          - name: index
