      - name: teachers
        label: Преподаватели
        type: object
        list: true
        fields:
          - name: name
            label: Имя
            type: string
            required: true
          - name: role
            label: Описание
            type: text
          - name: image
            label: Фото
            type: image
          - name: badge
            label: Плашка (напр. «Главный преподаватель»)
            type: string
          - name: imagePosition
            label: "⚙️ Кадрирование фото (техническое, не менять)"
            type: string
          - name: books
            label: Книги автора
            type: object
            list: true
            fields:
              - name: cover
                label: Обложка
                type: image
              - name: title
                label: Название книги
                type: string
              - name: note
                label: Авторы / подпись
                type: string
      - name: pricing
        label: Стоимость
        type: object
        fields:
          - name: price
            label: Цена (как показывается, напр. $589)
            type: string
            required: true
          - name: priceValue
            label: Цена числом (для расчёта рассрочки)
            type: number
            required: true
          - name: currency
            label: Значок валюты
            type: string
          - name: installments
            label: На сколько частей рассрочка
            type: number
          - name: note
            label: Приписка под ценой
            type: string
          - name: perk
            label: Бонус (скидка на другие курсы)
            type: text
          - name: primaryCta
            label: Главная кнопка
            type: string
          - name: secondaryCta
            label: Вторая кнопка (оплатить частями)
            type: string
      - name: faq
        label: Вопросы и ответы (FAQ)
        type: object
        list: true
        fields:
          - name: q
            label: Вопрос
            type: string
            required: true
          - name: a
            label: Ответ
            type: text
            required: true
      - name: videoLecture
        label: Видеолекция
        type: object
        fields:
          - name: title
            label: Заголовок над видео
            type: string
