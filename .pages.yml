            label: Текст отзыва
            type: text
            required: true

  # ── Консультации ─────────────────────────────────────────────────
  - name: consultations
    label: Консультации
    type: file
    path: content/consultations.json
    format: json
    fields:
      - name: hero
        label: Первый экран
        type: object
        fields:
          - name: title
            label: Заголовок
            type: string
            required: true
          - name: subtitle
            label: Подзаголовок
            type: string
          - name: cta
            label: Кнопка
            type: string
          - name: ctaHref
            label: "⚙️ Ссылка кнопки (техническое, не менять)"
            type: string
          - name: image
            label: Фоновая картинка
            type: image
      - name: intro
        label: Вступительный текст
        type: object
        fields:
          - name: text
            label: Текст
            type: text
      - name: questions
        label: Вопросы 01–06 (с чем приходят)
        type: object
        list: true
        fields:
          - name: number
            label: Номер (01, 02 …)
            type: string
          - name: question
            label: Вопрос
            type: string
      - name: teachersHeading
        label: Заголовок блока «Кто проводит»
        type: string
      - name: teachers
        label: Кто проводит консультации
        type: object
        list: true
        fields:
          - name: name
            label: Имя
            type: string
          - name: role
            label: Описание
            type: text
          - name: image
            label: Фото
            type: image
          - name: imagePosition
            label: "⚙️ Кадрирование фото (техническое, не менять)"
            type: string
      - name: servicesHeading
        label: Заголовок блока «Вместе мы»
        type: string
      - name: services
        label: Карточки «Вместе мы»
        type: object
        list: true
        fields:
          - name: title
            label: Заголовок
            type: string
          - name: text
            label: Текст
            type: text
      - name: formatsHeading
        label: Заголовок блока «Форматы услуг»
        type: string
      - name: formats
        label: Форматы услуг
        type: object
        list: true
        fields:
          - name: title
            label: Название формата
            type: string
          - name: description
            label: Описание
            type: text
          - name: durations
            label: Переключатель длительности (если есть)
            type: object
            list: true
            fields:
              - name: label
                label: Надпись (напр. 3 месяца)
                type: string
              - name: count
                label: Сколько консультаций входит
                type: number
          - name: extraNote
            label: Приписка (напр. + обратная связь)
            type: string
          - name: audience
            label: Для кого подходит
            type: text
      - name: pricing
        label: Стоимость
        type: object
        fields:
          - name: price
            label: Цена (напр. от 299$*)
            type: string
          - name: description
            label: Текст под ценой
            type: text
          - name: primaryCta
            label: Главная кнопка
            type: object
            fields:
              - name: label
                label: Надпись
                type: string
              - name: href
                label: Ссылка (Telegram)
                type: string
          - name: secondaryCta
            label: Вторая кнопка (письмо)
            type: object
            fields:
              - name: label
                label: Надпись
                type: string
          - name: notes
            label: Примечания (мелкий текст)
            type: text
            list: true
      - name: faq
        label: Вопросы и ответы (FAQ)
        type: object
        list: true
        fields:
          - name: q
            label: Вопрос
            type: string
          - name: a
            label: Ответ
            type: text
